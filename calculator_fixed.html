</head><body class="bg-surface-container-lowest text-on-surface flex justify-center items-start min-h-screen">

<button class="btn-num w-full aspect-square rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-variant" onclick="handleDecimal()">.</button>
<button class="w-full aspect-square rounded-full bg-primary text-on-primary flex items-center justify-center font-keypad-operator text-keypad-operator shadow-md transition-all duration-150 active:scale-95" onclick="handleEqual()">=</button>

<script>
    // --- State ---
    let displayValue = '0';
    let firstOperand = null;
    let waitingForSecondOperand = false;
    let operator = null;
    let historyExpression = '';
    
    // Preferences
    let prefs = {
      darkMode: true,
      sound: true,
      vibration: true
    };

    // --- DOM Elements ---
    const displayEl = document.getElementById('main-display');
    const historyEl = document.getElementById('history-display');
    const clearBtn = document.getElementById('btn-clear');
    
    // --- Operator Buttons ---
    const opButtons = {
      '/': document.getElementById('btn-div'),
      '*': document.getElementById('btn-mul'),
      '-': document.getElementById('btn-sub'),
      '+': document.getElementById('btn-add')
    };

    // --- Helper: Play Sound/Vibration ---
    function playFeedback() {
      if (prefs.vibration && navigator.vibrate) {
        navigator.vibrate(10);
      }
      if (prefs.sound) {
        // Simple synthetic click sound
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.05);
            gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
          }
        } catch(e) {}
      }
    }

    // Attach feedback to all buttons
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('pointerdown', playFeedback);
    });

    // --- Helper: Format Display Number ---
    function formatNumber(numStr) {
      if (numStr === 'Error' || numStr === 'NaN' || numStr === 'Infinity') return numStr;
      
      const parts = numStr.split('.');
      const integerPart = parts[0];
      const decimalPart = parts.length > 1 ? '.' + parts[1] : '';
      
      const isNegative = integerPart.startsWith('-');
      let rawInteger = isNegative ? integerPart.slice(1) : integerPart;

      rawInteger = rawInteger.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      
      return (isNegative ? '-' : '') + rawInteger + decimalPart;
    }

    // --- Helper: Update Display ---
    function updateDisplay() {
      const formatted = formatNumber(displayValue);
      displayEl.textContent = formatted;
      clearBtn.textContent = displayValue !== '0' ? 'C' : 'AC';
      adjustTextSize();
    }

    function adjustTextSize() {
      const container = displayEl.parentElement;
      const maxWidth = container.clientWidth - 16;
      displayEl.style.setProperty('--scale', 1);
      const textWidth = displayEl.scrollWidth;
      
      if (textWidth > maxWidth) {
        const scale = maxWidth / textWidth;
        displayEl.style.setProperty('--scale', Math.max(scale, 0.4));
      } else {
        displayEl.style.setProperty('--scale', 1);
      }
    }

    window.addEventListener('resize', adjustTextSize);

    function updateHistoryDisplay() {
      historyEl.textContent = historyExpression;
    }

    // --- Core Logic ---
    window.handleNumber = function(num) {
      if (waitingForSecondOperand) {
        displayValue = num;
        waitingForSecondOperand = false;
        clearActiveOperator();
      } else {
        const rawDigits = displayValue.replace(/[^0-9]/g, '');
        if (rawDigits.length >= 9 && displayValue !== '0') return;
        displayValue = displayValue === '0' ? num : displayValue + num;
      }
      updateDisplay();
    };

    window.handleDecimal = function() {
      if (waitingForSecondOperand) {
        displayValue = '0.';
        waitingForSecondOperand = false;
        clearActiveOperator();
        updateDisplay();
        return;
      }
      if (!displayValue.includes('.')) {
        displayValue += '.';
        updateDisplay();
      }
    };

    window.handleClear = function() {
      if (displayValue !== '0') {
        displayValue = '0';
        clearActiveOperator();
      } else {
        firstOperand = null;
        operator = null;
        historyExpression = '';
        waitingForSecondOperand = false;
        clearActiveOperator();
        updateHistoryDisplay();
      }
      updateDisplay();
    };

    window.handleSign = function() {
      if (displayValue === '0' || displayValue === 'Error') return;
      displayValue = (parseFloat(displayValue) * -1).toString();
      updateDisplay();
    };

    window.handlePercent = function() {
      if (displayValue === 'Error') return;
      const val = parseFloat(displayValue);
      if (firstOperand !== null && operator !== null && waitingForSecondOperand === false) {
         if (operator === '+' || operator === '-') {
            displayValue = (firstOperand * (val / 100)).toString();
         } else {
             displayValue = (val / 100).toString();
         }
      } else {
         displayValue = (val / 100).toString();
      }
      displayValue = parseFloat(parseFloat(displayValue).toPrecision(12)).toString();
      updateDisplay();
    };

    window.handleOperator = function(nextOperator) {
      const inputValue = parseFloat(displayValue);
      if (displayValue === 'Error') return;

      if (operator && waitingForSecondOperand) {
        operator = nextOperator;
        highlightOperator(nextOperator);
        return;
      }

      if (firstOperand === null && !isNaN(inputValue)) {
        firstOperand = inputValue;
      } else if (operator) {
        const result = calculate(firstOperand, inputValue, operator);
        if (result === 'Error') {
             displayValue = result;
             firstOperand = null;
             operator = null;
             waitingForSecondOperand = false;
             updateDisplay();
             return;
        }
        const cleanResult = parseFloat(result.toPrecision(12));
        displayValue = String(cleanResult);
        firstOperand = cleanResult;
        saveToHistory(firstOperand, inputValue, operator, cleanResult);
      }

      waitingForSecondOperand = true;
      operator = nextOperator;
      
      let opSymbol = nextOperator;
      if(opSymbol === '*') opSymbol = '×';
      if(opSymbol === '/') opSymbol = '÷';
      if(opSymbol === '-') opSymbol = '−';
      
      historyExpression = `${formatNumber(String(firstOperand))} ${opSymbol}`;
      updateHistoryDisplay();
      updateDisplay();
      highlightOperator(nextOperator);
    };

    window.handleEqual = function() {
      if (operator === null || waitingForSecondOperand) {
         if(operator !== null && firstOperand !== null) {
            const result = calculate(firstOperand, firstOperand, operator);
             if (result === 'Error') {
                 displayValue = result;
                 updateDisplay();
                 return;
             }
             const cleanResult = parseFloat(result.toPrecision(12));
             displayValue = String(cleanResult);
             saveToHistory(firstOperand, firstOperand, operator, cleanResult);
             firstOperand = cleanResult;
         }
         return;
      }

      const inputValue = parseFloat(displayValue);
      const result = calculate(firstOperand, inputValue, operator);
      
      if (result === 'Error') {
         displayValue = result;
      } else {
         const cleanResult = parseFloat(result.toPrecision(12));
         displayValue = String(cleanResult);
         saveToHistory(firstOperand, inputValue, operator, cleanResult);
         firstOperand = cleanResult;
      }

      operator = null;
      waitingForSecondOperand = true;
      historyExpression = '';
      
      updateHistoryDisplay();
      updateDisplay();
      clearActiveOperator();
    };

    function calculate(first, second, op) {
      if (op === '+') return first + second;
      if (op === '-') return first - second;
      if (op === '*') return first * second;
      if (op === '/') {
        if (second === 0) return 'Error';
        return first / second;
      }
      return second;
    }

    function highlightOperator(op) {
      clearActiveOperator();
      if (opButtons[op]) {
        opButtons[op].classList.replace('bg-primary-container', 'bg-inverse-primary');
        opButtons[op].classList.replace('text-on-primary-container', 'text-surface');
      }
    }

    function clearActiveOperator() {
      Object.values(opButtons).forEach(btn => {
        if(btn) {
           btn.classList.replace('bg-inverse-primary', 'bg-primary-container');
           btn.classList.replace('text-surface', 'text-on-primary-container');
        }
      });
    }

    // --- Persistence & History View ---
    function saveToHistory(op1, op2, op, result) {
       try {
           const historyStr = localStorage.getItem('calc_history');
           let history = historyStr ? JSON.parse(historyStr) : [];
           
           let symbol = op;
           if(symbol === '*') symbol = '×';
           if(symbol === '/') symbol = '÷';
           if(symbol === '-') symbol = '−';

           const expression = `${formatNumber(String(op1))} ${symbol} ${formatNumber(String(op2))}`;
           
           history.unshift({
               expression: expression,
               result: formatNumber(String(result)),
               timestamp: new Date().getTime()
           });
           
           if(history.length > 30) history = history.slice(0, 30);
           
           localStorage.setItem('calc_history', JSON.stringify(history));
           renderHistory();
       } catch (e) {
           console.error("Could not save to history", e);
       }
    }

    function renderHistory() {
      const historyList = document.getElementById('history-list');
      try {
        const historyStr = localStorage.getItem('calc_history');
        const history = historyStr ? JSON.parse(historyStr) : [];
        
        if (history.length === 0) {
          historyList.innerHTML = '<div class="text-center text-on-surface-variant py-10 opacity-60 font-expression-history">No history yet</div>';
          return;
        }

        historyList.innerHTML = history.map(item => `
          <div class="flex flex-col items-end bg-surface-container rounded-xl p-4 shadow-sm">
            <span class="text-on-surface-variant font-expression-history opacity-70 text-sm mb-1">${item.expression} =</span>
            <span class="text-on-surface font-display-result-mobile text-[32px]">${item.result}</span>
          </div>
        `).join('');
      } catch(e) {}
    }

    window.clearHistory = function() {
      localStorage.removeItem('calc_history');
      renderHistory();
    }

    // --- Interaction: Copy Result ---
    window.copyResult = function() {
      if(displayValue === 'Error' || displayValue === 'NaN') return;
      
      navigator.clipboard.writeText(displayValue).then(() => {
        const toast = document.getElementById('toast');
        displayEl.style.opacity = '0.5';
        setTimeout(() => displayEl.style.opacity = '1', 150);
        toast.classList.remove('opacity-0', 'translate-y-2');
        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
        }, 2000);
      });
    }

    // --- Navigation Logic ---
    // The <nav> element appears after this script, so attach the navigation
    // listeners after the DOM has finished loading.
    document.addEventListener('DOMContentLoaded', () => {
      const navButtons = document.querySelectorAll('nav a');
      const views = {
        calculator: document.getElementById('view-calculator'),
        history: document.getElementById('view-history'),
        settings: document.getElementById('view-settings')
      };
      const headerTitle = document.getElementById('header-title');

      navButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();

          const targetView = btn.getAttribute('data-path');
          if (!views[targetView]) return;

          navButtons.forEach(b => {
            b.classList.remove('text-primary');
            b.classList.add('text-on-surface-variant');
          });

          btn.classList.remove('text-on-surface-variant');
          btn.classList.add('text-primary');

          Object.values(views).forEach(v => {
            v.classList.add('view-hidden');
            v.classList.remove('flex');
          });

          views[targetView].classList.remove('view-hidden');
          views[targetView].classList.add('flex');

          headerTitle.textContent =
            targetView.charAt(0).toUpperCase() + targetView.slice(1);

          if (targetView === 'history') {
            renderHistory();
          }
        });
      });
    });

    // --- Settings Logic ---
    function loadSettings() {
      try {
        const savedPrefs = localStorage.getItem('calc_prefs');
        if (savedPrefs) {
          prefs = JSON.parse(savedPrefs);
        }
        
        document.getElementById('theme-toggle').checked = prefs.darkMode;
        document.getElementById('sound-toggle').checked = prefs.sound;
        document.getElementById('vibration-toggle').checked = prefs.vibration;
        
        applyTheme();
      } catch(e){}
    }

    function saveSettings() {
      localStorage.setItem('calc_prefs', JSON.stringify(prefs));
    }

    function applyTheme() {
      if (prefs.darkMode) {
        document.documentElement.classList.add('dark');
        document.body.style.backgroundColor = '#0e0e10';
      } else {
        document.documentElement.classList.remove('dark');
        document.body.style.backgroundColor = '#ffffff'; // Rough light mode fallback if tailwind class fails
      }
    }

    document.getElementById('theme-toggle').addEventListener('change', (e) => {
      prefs.darkMode = e.target.checked;
      applyTheme();
      saveSettings();
    });

    document.getElementById('sound-toggle').addEventListener('change', (e) => {
      prefs.sound = e.target.checked;
      saveSettings();
    });

    document.getElementById('vibration-toggle').addEventListener('change', (e) => {
      prefs.vibration = e.target.checked;
      saveSettings();
    });

    // Init
    setTimeout(adjustTextSize, 50);
    renderHistory();
    loadSettings();

  </script>
</main><nav class="absolute bottom-0 inset-x-0 z-50 pb-safe bg-surface-container/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.2)]" data-active-classes="text-primary"><div class="flex justify-around items-center h-20 px-4"><a aria-current="page" class="flex flex-col items-center justify-center gap-1 w-20 h-16 transition-all duration-300 text-primary" data-path="calculator" href="#"><span class="material-symbols-outlined text-[26px]">calculate</span><span class="font-label-sm text-[10px] uppercase tracking-tighter">Calc</span></a><a class="flex flex-col items-center justify-center gap-1 w-20 h-16 text-on-surface-variant transition-all duration-300" data-path="history" href="#"><span class="material-symbols-outlined text-[26px]">history</span><span class="font-label-sm text-[10px] uppercase tracking-tighter">History</span></a><a class="flex flex-col items-center justify-center gap-1 w-20 h-16 text-on-surface-variant transition-all duration-300" data-path="settings" href="#"><span class="material-symbols-outlined text-[26px]">settings</span><span class="font-label-sm text-[10px] uppercase tracking-tighter">Settings</span></a></div></nav>
</div>
