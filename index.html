<script>
  document.addEventListener('DOMContentLoaded', () => {
    const displayResult = document.getElementById('display-result');
    const displayHistory = document.getElementById('display-history');
    const buttons = document.querySelectorAll('.calc-btn');

    let currentOperand = '0';
    let previousOperand = '';
    let operation = null;
    let shouldResetScreen = false;

    function formatNumber(number) {
        if (number === '' || number == null) return '';
        if (number === '-') return '-';
        if (number === 'Error') return 'Error';
        const stringNumber = number.toString();
        if (stringNumber === 'NaN') return 'Error';
        const integerDigits = parseFloat(stringNumber.split('.')[0]);
        const decimalDigits = stringNumber.split('.')[1];
        let integerDisplay;
        if (isNaN(integerDigits)) {
            integerDisplay = '';
        } else {
            integerDisplay = integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });
        }
        if (decimalDigits != null) {
            return `${integerDisplay}.${decimalDigits}`;
        } else {
            return integerDisplay;
        }
    }

    function updateDisplay() {
        displayResult.textContent = formatNumber(currentOperand);
        if (operation != null) {
            let opSymbol = operation;
            if (operation === 'multiply') opSymbol = '×';
            if (operation === 'divide') opSymbol = '÷';
            if (operation === 'add') opSymbol = '+';
            if (operation === 'subtract') opSymbol = '−';
            displayHistory.textContent = `${formatNumber(previousOperand)} ${opSymbol}`;
        } else {
            displayHistory.textContent = '';
        }
    }

    function appendNumber(number) {
        if (shouldResetScreen) {
            currentOperand = '';
            shouldResetScreen = false;
        }
        if (number === '.' && currentOperand.includes('.')) return;
        if (currentOperand === '0' && number !== '.') {
            currentOperand = number;
        } else {
            currentOperand = currentOperand.toString() + number.toString();
        }
    }

    function chooseOperation(op) {
        if (currentOperand === '') return;
        if (previousOperand !== '') {
            compute();
        }
        operation = op;
        previousOperand = currentOperand;
        currentOperand = '';
    }

    function compute() {
        let computation;
        const prev = parseFloat(previousOperand);
        const current = parseFloat(currentOperand);
        if (isNaN(prev) || isNaN(current)) return;
        switch (operation) {
            case 'add':
                computation = prev + current;
                break;
            case 'subtract':
                computation = prev - current;
                break;
            case 'multiply':
                computation = prev * current;
                break;
            case 'divide':
                computation = prev / current;
                break;
            default:
                return;
        }
        currentOperand = computation.toString();
        operation = null;
        previousOperand = '';
    }

    function clear() {
        currentOperand = '0';
        previousOperand = '';
        operation = null;
    }
    
    function calculatePercentage() {
        if (currentOperand === '') return;
        currentOperand = (parseFloat(currentOperand) / 100).toString();
    }

    function handleInput(val) {
        if (!isNaN(val) || val === 'decimal') {
            appendNumber(val === 'decimal' ? '.' : val);
            updateDisplay();
        } else if (['add', 'subtract', 'multiply', 'divide'].includes(val)) {
            chooseOperation(val);
            updateDisplay();
        } else if (val === 'equals') {
            compute();
            shouldResetScreen = true;
            updateDisplay();
        } else if (val === 'clear') {
            clear();
            updateDisplay();
        } else if (val === 'percent') {
            calculatePercentage();
            updateDisplay();
        }
    }

    // Subtle scale animation on display text when equals is pressed
    buttons.forEach(btn => {
      const handlePress = () => {
        // Haptic feedback simulation
        if (navigator.vibrate) navigator.vibrate(5);
        
        handleInput(btn.dataset.val);

        if (btn.dataset.val === 'equals') {
          displayResult.style.transform = 'scale(1.02)';
          displayHistory.style.transform = 'translateY(-2px) scale(0.98)';
          displayHistory.style.opacity = '0.7';
          
          setTimeout(() => {
            displayResult.style.transform = 'scale(1)';
            displayHistory.style.transform = 'translateY(0) scale(1)';
            displayHistory.style.opacity = '1';
          }, 200);
        } else if (btn.classList.contains('number') || btn.classList.contains('operator')) {
            // Ripple-like subtle text pulse
            displayResult.style.opacity = '0.5';
            setTimeout(() => displayResult.style.opacity = '1', 100);
        }
      };

      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handlePress();
      });
      
      btn.addEventListener('mousedown', (e) => {
         if (e.pointerType === 'mouse') {
            handlePress();
         }
      });
    });

    // Dynamic font sizing based on length (simplified simulation)
    const observer = new MutationObserver(() => {
      const text = displayResult.textContent.trim();
      if (text.length > 8) {
        displayResult.style.fontSize = '40px';
      } else {
         displayResult.style.fontSize = ''; // revert to class default
      }
      
      // trigger fade in on change
      displayResult.style.opacity = '0';
      displayResult.style.transform = 'translateY(4px)';
      requestAnimationFrame(() => {
          requestAnimationFrame(() => {
              displayResult.style.opacity = '1';
              displayResult.style.transform = 'translateY(0)';
          });
      });
    });
    
    observer.observe(displayResult, { childList: true, characterData: true, subtree: true });
    updateDisplay();
  });
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container/90 backdrop-blur-xl" data-active-classes="text-primary"><div class="flex justify-around items-center h-16 px-4"><a aria-current="page" class="flex flex-col items-center justify-center gap-1 w-16 text-primary" data-path="calculator" href="#"><span class="material-symbols-outlined">calculate</span><span class="text-[10px] font-medium">Calc</span></a><a class="flex flex-col items-center justify-center gap-1 w-16 text-on-surface-variant" data-path="history" href="#"><span class="material-symbols-outlined">history</span><span class="text-[10px] font-medium">History</span></a><a class="flex flex-col items-center justify-center gap-1 w-16 text-on-surface-variant" data-path="settings" href="#"><span class="material-symbols-outlined">settings</span><span class="text-[10px] font-medium">Settings</span></a></div></nav></body></html>
