<style>@layer base { body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } </style><style>
    body {
      min-height: max(884px, 100dvh);
    }
    
    /* Animation Keyframes */
    @keyframes staggerSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    
    @keyframes glowPulse {
      0% { box-shadow: inset 0 -4px 8px rgba(0,0,0,0.1), 0 4px 12px rgba(255, 189, 127,0.2); }
      50% { box-shadow: inset 0 -4px 8px rgba(0,0,0,0.1), 0 4px 20px rgba(255, 189, 127,0.4); }
      100% { box-shadow: inset 0 -4px 8px rgba(0,0,0,0.1), 0 4px 12px rgba(255, 189, 127,0.2); }
    }
    
    .stagger-btn {
      opacity: 0;
      animation: staggerSlideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    
    .calc-btn {
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.15s ease;
    }
    
    .calc-btn:active {
      transform: scale(0.92);
    }
    
    .display-update {
      transition: opacity 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    
    .equals-glow {
      animation: glowPulse 2s infinite ease-in-out;
      background: linear-gradient(90deg, #ffbd7f 0%, rgba(255,255,255,0.2) 50%, #ffbd7f 100%);
      background-size: 200% auto;
      background-color: #ffbd7f;
      animation: shimmer 3s infinite linear, glowPulse 3s infinite ease-in-out;
    }
    
    .equals-glow:active {
        animation: none;
    }
  </style>
</head>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const displayResult = document.getElementById('display-result');
    const displayHistory = document.getElementById('display-history');
    const buttons = document.querySelectorAll('.calc-btn');

    let currentVal = '0';
    let previousVal = '';
    let operator = null;
    let waitingForNewValue = false;
    let lastCalculated = false;
    let storedOperator = null; // for sequential ops

    function formatDisplayNumber(numStr) {
      if (numStr === 'Error' || numStr === 'NaN') return 'Error';
      const parts = String(numStr).split('.');
      let intPart = parts[0];
      if (intPart.length > 1 && intPart.startsWith('0') && !intPart.startsWith('0.')) {
        intPart = intPart.replace(/^0+/, '');
        if (intPart === '') intPart = '0';
      }
      return parts.length > 1 ? `${intPart}.${parts[1]}` : intPart;
    }

    function updateDisplay() {
        displayResult.textContent = formatDisplayNumber(currentVal);
        if (operator && previousVal !== '') {
            let opSymbol = operator;
            if (operator === 'multiply') opSymbol = '×';
            if (operator === 'divide') opSymbol = '÷';
            if (operator === 'add') opSymbol = '+';
            if (operator === 'subtract') opSymbol = '−';
            displayHistory.textContent = `${formatDisplayNumber(previousVal)} ${opSymbol}`;
        } else {
            displayHistory.textContent = '';
        }
    }

    function calculate() {
        const prev = parseFloat(previousVal);
        const current = parseFloat(currentVal);
        if (isNaN(prev) || isNaN(current)) return;
        
        let result = 0;
        let opToUse = operator || storedOperator;
        
        switch (opToUse) {
            case 'add': result = prev + current; break;
            case 'subtract': result = prev - current; break;
            case 'multiply': result = prev * current; break;
            case 'divide': 
              if (current === 0) {
                currentVal = 'Error';
                return;
              }
              result = prev / current; 
              break;
            default:
              return;
        }
        
        // Handle floating point precision
        result = Math.round(result * 1000000000000) / 1000000000000;
        currentVal = result.toString();
    }

    buttons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            const val = btn.dataset.val;
            
            // Haptic feedback simulation
            if (navigator.vibrate) navigator.vibrate(5);
            
            // Animation
            if (val === 'equals') {
                displayResult.style.transform = 'scale(1.02)';
                setTimeout(() => displayResult.style.transform = 'scale(1)', 200);
            } else {
                displayResult.style.opacity = '0.5';
                setTimeout(() => displayResult.style.opacity = '1', 100);
            }

            if (!isNaN(val) || val === 'decimal') {
                if (lastCalculated) {
                    currentVal = '0';
                    lastCalculated = false;
                    operator = null;
                }
                const char = val === 'decimal' ? '.' : val;
                if (waitingForNewValue || currentVal === 'Error') {
                    currentVal = char === '.' ? '0.' : char;
                    waitingForNewValue = false;
                } else {
                    if (char === '.' && currentVal.includes('.')) return;
                    if (currentVal === '0' && char !== '.') {
                        currentVal = char;
                    } else {
                        currentVal += char;
                    }
                }
                updateDisplay();
            } else if (['add', 'subtract', 'multiply', 'divide'].includes(val)) {
                if (currentVal === 'Error') return;
                previousVal = currentVal;
                operator = val;
                storedOperator = val;
                waitingForNewValue = true;
                lastCalculated = false;
                updateDisplay();
            } else if (val === 'equals') {
                if (currentVal === 'Error') return;
                if (operator && previousVal !== '') {
                    calculate();
                    operator = null;
                    previousVal = '';
                    waitingForNewValue = true;
                    lastCalculated = true;
                    updateDisplay();
                }
            } else if (val === 'clear') {
                currentVal = '0';
                previousVal = '';
                operator = null;
                storedOperator = null;
                waitingForNewValue = false;
                lastCalculated = false;
                updateDisplay();
            } else if (val === 'percent') {
                if (currentVal === 'Error') return;
                currentVal = (parseFloat(currentVal) / 100).toString();
                waitingForNewValue = true;
                updateDisplay();
            } else if (val === 'sign') {
                if (currentVal === 'Error') return;
                if (currentVal !== '0') {
                    currentVal = currentVal.startsWith('-') ? currentVal.slice(1) : '-' + currentVal;
                    updateDisplay();
                }
            }
        });
    });

    updateDisplay();
});
</script>
