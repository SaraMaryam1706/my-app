  </head><body class="bg-background text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-background/80 backdrop-blur-xl pt-safe"><div class="h-14 px-screen-margin flex items-center justify-between"><span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Calculator</span><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 relative w-full pt-14 pb-24 bg-background"><div class="flex flex-col w-full h-full relative font-keypad-number select-none">
<!-- Display Area -->
<div class="flex-1 px-screen-margin pt-display-padding-y pb-4 flex flex-col justify-end items-end relative min-h-[160px]">
<!-- Toast Notification (Absolute positioned in top right of display area) -->
<div class="absolute top-4 right-screen-margin bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm px-4 py-2 rounded-full shadow-lg opacity-0 transform translate-y-2 transition-all duration-300 pointer-events-none flex items-center gap-2 z-10" id="toast">
<span class="material-symbols-outlined text-[16px]">info</span>
<span id="toast-message">Copied to clipboard</span>
</div>
<div class="w-full flex justify-end mb-2 h-[24px]">
<span class="font-expression-history text-expression-history text-on-surface-variant opacity-60 tracking-wider" id="history-display"></span>
</div>
<!-- Main Result Wrapper for sizing and overflow -->
<div class="w-full relative h-[96px] flex justify-end items-end overflow-hidden cursor-pointer touch-manipulation" onclick="copyResult()">
<!-- Use CSS custom property for dynamic scaling -->
<span class="font-display-result text-display-result text-on-surface whitespace-nowrap tracking-tight transition-transform duration-100 ease-out origin-right" id="main-display" style="transform: scale(var(--scale, 1));">0</span>
</div>
</div>
<!-- Keypad Area -->
<div class="pb-keypad-bottom-safe px-screen-margin pt-4 bg-surface rounded-t-xl z-10 relative shadow-[0_-8px_24px_rgba(0,0,0,0.1)]">
<!-- Mode Toggle (Deg/Rad) - Positioned above keypad -->
<div class="absolute -top-12 left-screen-margin flex bg-surface-container-high rounded-full p-1 shadow-md">
<button class="font-label-sm text-label-sm px-3 py-1 rounded-full text-on-surface bg-surface-variant transition-colors duration-200">RAD</button>
<button class="font-label-sm text-label-sm px-3 py-1 rounded-full text-on-surface-variant hover:text-on-surface transition-colors duration-200">DEG</button>
</div>
<div class="grid grid-cols-4 gap-key-gap">
<!-- Row 1: Utils -->
<button class="btn-util w-full aspect-square rounded-full bg-secondary text-on-secondary flex items-center justify-center font-keypad-operator text-[24px] shadow-sm transition-all duration-150 active:scale-95 active:bg-secondary-fixed" id="btn-clear" onclick="handleClear()">AC</button>
<button class="btn-util w-full aspect-square rounded-full bg-secondary text-on-secondary flex items-center justify-center font-keypad-operator text-keypad-operator shadow-sm transition-all duration-150 active:scale-95 active:bg-secondary-fixed" onclick="handleSign()">+/-</button>
<button class="btn-util w-full aspect-square rounded-full bg-secondary text-on-secondary flex items-center justify-center font-keypad-operator text-keypad-operator shadow-sm transition-all duration-150 active:scale-95 active:bg-secondary-fixed" onclick="handlePercent()">%</button>
<button class="btn-op w-full aspect-square rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-keypad-operator text-keypad-operator shadow-sm transition-all duration-150 active:scale-95" id="btn-div" onclick="handleOperator('/')">÷</button>
<!-- Row 2 -->
<button class="btn-num w-full aspect-square rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-variant" onclick="handleNumber('7')">7</button>
<button class="btn-num w-full aspect-square rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-variant" onclick="handleNumber('8')">8</button>
<button class="btn-num w-full aspect-square rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-variant" onclick="handleNumber('9')">9</button>
<button class="btn-op w-full aspect-square rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-keypad-operator text-keypad-operator shadow-sm transition-all duration-150 active:scale-95" id="btn-mul" onclick="handleOperator('*')">×</button>
<!-- Row 3 -->
<button class="btn-num w-full aspect-square rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-variant" onclick="handleNumber('4')">4</button>
<button class="btn-num w-full aspect-square rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-variant" onclick="handleNumber('5')">5</button>
<button class="btn-num w-full aspect-square rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-variant" onclick="handleNumber('6')">6</button>
<button class="btn-op w-full aspect-square rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-keypad-operator text-keypad-operator shadow-sm transition-all duration-150 active:scale-95" id="btn-sub" onclick="handleOperator('-')">−</button>
<!-- Row 4 -->
<button class="btn-num w-full aspect-square rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-variant" onclick="handleNumber('1')">1</button>
<button class="btn-num w-full aspect-square rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-variant" onclick="handleNumber('2')">2</button>
<button class="btn-num w-full aspect-square rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-variant" onclick="handleNumber('3')">3</button>
<button class="btn-op w-full aspect-square rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-keypad-operator text-keypad-operator shadow-sm transition-all duration-150 active:scale-95" id="btn-add" onclick="handleOperator('+')">+</button>
<!-- Row 5 -->
<button class="btn-num col-span-2 w-full h-[calc((100vw-48px-36px)/4)] max-h-[108px] rounded-full bg-surface-container-highest text-on-surface flex items-center justify-start pl-8 font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-[0.98] active:bg-surface-variant" onclick="handleNumber('0')">0</button>
<button class="btn-num w-full aspect-square rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-keypad-number text-keypad-number shadow-sm transition-all duration-150 active:scale-95 active:bg-surface-variant" onclick="handleDecimal()">.</button>
<button class="w-full aspect-square rounded-full bg-primary text-on-primary flex items-center justify-center font-keypad-operator text-keypad-operator shadow-md transition-all duration-150 active:scale-95" onclick="handleEqual()">=</button>
</div>
</div>
<script>
    // --- State ---
    let displayValue = '0';
    let firstOperand = null;
    let waitingForSecondOperand = false;
    let operator = null;
    let historyExpression = '';

    // --- DOM Elements ---
    const displayEl = document.getElementById('main-display');
    const historyEl = document.getElementById('history-display');
    const clearBtn = document.getElementById('btn-clear');
    
    // --- Operator Buttons ---
    const opButtons = {
      '/': document.getElementById('btn-div'),
      '*': document.getElementById('btn-mul'),
      '-': document.getElementById('btn-sub'),
      '+': document.getElementById('btn-add')
    };

    // --- Helper: Format Display Number ---
    // Adds commas for thousands, handles long decimals.
    function formatNumber(numStr) {
      if (numStr === 'Error' || numStr === 'NaN' || numStr === 'Infinity') return numStr;
      
      const parts = numStr.split('.');
      const integerPart = parts[0];
      const decimalPart = parts.length > 1 ? '.' + parts[1] : '';
      
      // Remove negative sign for processing, then add back
      const isNegative = integerPart.startsWith('-');
      let rawInteger = isNegative ? integerPart.slice(1) : integerPart;

      // Add commas
      rawInteger = rawInteger.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      
      return (isNegative ? '-' : '') + rawInteger + decimalPart;
    }

    // --- Helper: Update Display ---
    function updateDisplay() {
      // Format number
      const formatted = formatNumber(displayValue);
      displayEl.textContent = formatted;
      
      // Update AC / C button text
      clearBtn.textContent = displayValue !== '0' ? 'C' : 'AC';

      // Auto-scale text to fit
      adjustTextSize();
    }

    // Auto-scale logic based on container width vs text width
    function adjustTextSize() {
      const container = displayEl.parentElement;
      const maxWidth = container.clientWidth - 16; // 16px padding
      
      // Reset scale to measure true width
      displayEl.style.setProperty('--scale', 1);
      
      const textWidth = displayEl.scrollWidth;
      
      if (textWidth > maxWidth) {
        const scale = maxWidth / textWidth;
        // Don't shrink too small
        displayEl.style.setProperty('--scale', Math.max(scale, 0.4));
      } else {
        displayEl.style.setProperty('--scale', 1);
      }
    }

    // Listen for resize to recalculate scaling
    window.addEventListener('resize', adjustTextSize);

    function updateHistoryDisplay() {
      historyEl.textContent = historyExpression;
    }

    // --- Core Logic: Number Input ---
    window.handleNumber = function(num) {
      if (waitingForSecondOperand) {
        displayValue = num;
        waitingForSecondOperand = false;
        clearActiveOperator();
      } else {
        // Limit max digits
        const rawDigits = displayValue.replace(/[^0-9]/g, '');
        if (rawDigits.length >= 9 && displayValue !== '0') return; // Typical 9 digit limit
        
        displayValue = displayValue === '0' ? num : displayValue + num;
      }
      updateDisplay();
    };

    // --- Core Logic: Decimal Input ---
    window.handleDecimal = function() {
      if (waitingForSecondOperand) {
        displayValue = '0.';
        waitingForSecondOperand = false;
        clearActiveOperator();
        updateDisplay();
        return;
      }

      if (!displayValue.includes('.')) {
        displayValue += '.';
        updateDisplay();
      }
    };

    // --- Core Logic: Clear ---
    window.handleClear = function() {
      if (displayValue !== '0') {
        // Soft clear: Just clear current input
        displayValue = '0';
        clearActiveOperator();
      } else {
        // Hard clear (AC): Clear everything
        firstOperand = null;
        operator = null;
        historyExpression = '';
        waitingForSecondOperand = false;
        clearActiveOperator();
        updateHistoryDisplay();
      }
      updateDisplay();
    };

    // --- Core Logic: Sign Toggle ---
    window.handleSign = function() {
      if (displayValue === '0' || displayValue === 'Error') return;
      displayValue = (parseFloat(displayValue) * -1).toString();
      updateDisplay();
    };

    // --- Core Logic: Percent ---
    window.handlePercent = function() {
      if (displayValue === 'Error') return;
      
      const val = parseFloat(displayValue);
      // For basic calculators, if we have a first operand and an operator, % means percentage of first operand
      // e.g. 100 + 5% = 100 + 5.
      if (firstOperand !== null && operator !== null && waitingForSecondOperand === false) {
         if (operator === '+' || operator === '-') {
            // 5% of firstOperand
            displayValue = (firstOperand * (val / 100)).toString();
         } else {
            // just divide by 100 for * and /
             displayValue = (val / 100).toString();
         }
      } else {
         displayValue = (val / 100).toString();
      }
      
      // Limit precision to avoid float issues like 0.0000000000001
      displayValue = parseFloat(parseFloat(displayValue).toPrecision(12)).toString();
      updateDisplay();
    };

    // --- Core Logic: Operator ---
    window.handleOperator = function(nextOperator) {
      const inputValue = parseFloat(displayValue);

      if (displayValue === 'Error') return;

      if (operator && waitingForSecondOperand) {
        // Changed mind, just update operator
        operator = nextOperator;
        highlightOperator(nextOperator);
        return;
      }

      if (firstOperand === null && !isNaN(inputValue)) {
        firstOperand = inputValue;
      } else if (operator) {
        const result = calculate(firstOperand, inputValue, operator);
        
        if (result === 'Error') {
             displayValue = result;
             firstOperand = null;
             operator = null;
             waitingForSecondOperand = false;
             updateDisplay();
             return;
        }
        
        // Fix float precision issues
        const cleanResult = parseFloat(result.toPrecision(12));
        displayValue = String(cleanResult);
        firstOperand = cleanResult;
        
        // Save to history list in localStorage when chaining operations
        saveToHistory(firstOperand, inputValue, operator, cleanResult);
      }

      waitingForSecondOperand = true;
      operator = nextOperator;
      
      // Update small history display above main result
      let opSymbol = nextOperator;
      if(opSymbol === '*') opSymbol = '×';
      if(opSymbol === '/') opSymbol = '÷';
      if(opSymbol === '-') opSymbol = '−';
      
      historyExpression = `${formatNumber(String(firstOperand))} ${opSymbol}`;
      updateHistoryDisplay();
      
      updateDisplay();
      highlightOperator(nextOperator);
    };

    // --- Core Logic: Calculate (=) ---
    window.handleEqual = function() {
      if (operator === null || waitingForSecondOperand) {
         // If they hit = right after an operator, repeat operation on itself
         if(operator !== null && firstOperand !== null) {
            const result = calculate(firstOperand, firstOperand, operator);
             if (result === 'Error') {
                 displayValue = result;
                 updateDisplay();
                 return;
             }
             const cleanResult = parseFloat(result.toPrecision(12));
             displayValue = String(cleanResult);
             
             saveToHistory(firstOperand, firstOperand, operator, cleanResult);
             
             firstOperand = cleanResult;
         }
         return;
      }

      const inputValue = parseFloat(displayValue);
      const result = calculate(firstOperand, inputValue, operator);
      
      if (result === 'Error') {
         displayValue = result;
      } else {
         const cleanResult = parseFloat(result.toPrecision(12));
         displayValue = String(cleanResult);
         
         // Save to history storage
         saveToHistory(firstOperand, inputValue, operator, cleanResult);
         
         firstOperand = cleanResult; // Prepare for next operation
      }

      operator = null;
      waitingForSecondOperand = true; // Wait for next input
      historyExpression = '';
      
      updateHistoryDisplay();
      updateDisplay();
      clearActiveOperator();
    };

    function calculate(first, second, op) {
      if (op === '+') return first + second;
      if (op === '-') return first - second;
      if (op === '*') return first * second;
      if (op === '/') {
        if (second === 0) return 'Error';
        return first / second;
      }
      return second;
    }

    // --- UI: Operator Highlighting ---
    function highlightOperator(op) {
      clearActiveOperator();
      if (opButtons[op]) {
        // Apply active visual state: invert colors
        opButtons[op].classList.replace('bg-primary-container', 'bg-inverse-primary');
        opButtons[op].classList.replace('text-on-primary-container', 'text-surface');
      }
    }

    function clearActiveOperator() {
      Object.values(opButtons).forEach(btn => {
        if(btn) {
           btn.classList.replace('bg-inverse-primary', 'bg-primary-container');
           btn.classList.replace('text-surface', 'text-on-primary-container');
        }
      });
    }

    // --- Persistence: History ---
    function saveToHistory(op1, op2, op, result) {
       try {
           const historyStr = localStorage.getItem('calc_history');
           let history = historyStr ? JSON.parse(historyStr) : [];
           
           let symbol = op;
           if(symbol === '*') symbol = '×';
           if(symbol === '/') symbol = '÷';
           if(symbol === '-') symbol = '−';

           const expression = `${op1} ${symbol} ${op2}`;
           
           history.unshift({
               expression: expression,
               result: String(result),
               timestamp: new Date().getTime()
           });
           
           // Keep only last 20 entries
           if(history.length > 20) history = history.slice(0, 20);
           
           localStorage.setItem('calc_history', JSON.stringify(history));
       } catch (e) {
           console.error("Could not save to history", e);
       }
    }

    // --- Interaction: Copy Result ---
    window.copyResult = function() {
      if(displayValue === 'Error' || displayValue === 'NaN') return;
      
      navigator.clipboard.writeText(displayValue).then(() => {
        const toast = document.getElementById('toast');
        
        // Add subtle animation to text
        displayEl.style.opacity = '0.5';
        setTimeout(() => displayEl.style.opacity = '1', 150);

        // Show toast
        toast.classList.remove('opacity-0', 'translate-y-2');
        
        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
        }, 2000);
      });
    }

    // Handle initial sizing
    setTimeout(adjustTextSize, 50);

  </script>
</div></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.2)]" data-active-classes="text-primary"><div class="flex justify-around items-center h-20 px-4"><a aria-current="page" class="flex flex-col items-center justify-center gap-1 w-20 h-16 transition-all duration-300 text-primary" data-path="calculator" href="#"><span class="material-symbols-outlined text-[26px]">calculate</span><span class="font-label-sm text-[10px] uppercase tracking-tighter">Calc</span></a><a class="flex flex-col items-center justify-center gap-1 w-20 h-16 text-on-surface-variant transition-all duration-300" data-path="history" href="#"><span class="material-symbols-outlined text-[26px]">history</span><span class="font-label-sm text-[10px] uppercase tracking-tighter">History</span></a><a class="flex flex-col items-center justify-center gap-1 w-20 h-16 text-on-surface-variant transition-all duration-300" data-path="settings" href="#"><span class="material-symbols-outlined text-[26px]">settings</span><span class="font-label-sm text-[10px] uppercase tracking-tighter">Settings</span></a></div></nav></body></html>
